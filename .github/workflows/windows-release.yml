name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches: ['release/windows-*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      NO_PROXY: '127.0.0.1,localhost,::1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Build unified Flutter client and installer
        shell: pwsh
        run: |
          python scripts/version.py --platform windows
          if ($LASTEXITCODE -ne 0) { throw 'Invalid Windows release version' }
          ./scripts/windows/build-flutter.ps1 -MakeNsis 'C:\Program Files (x86)\NSIS\makensis.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: flux6-windows-x64
          path: dist/windows/*-unified/*
          if-no-files-found: error
