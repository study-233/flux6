name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Repository and Web checks
        run: |
          python3 scripts/maintenance/check-repository.py
          python3 scripts/maintenance/test_maintenance.py
          python3 scripts/check-icons.py
          python3 scripts/check-publisher.py
          node --experimental-vm-modules scripts/check-web-modules.mjs
      - name: Detect shared Go changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'go=true' >> "$GITHUB_OUTPUT"
          else
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
            fi
            changed=$(git diff --name-only "$BASE_SHA" HEAD -- go.mod go.sum cmd/ internal/ mobileapi/ .github/workflows/ci.yml)
            if [[ -n "$changed" ]]; then
              echo 'go=true' >> "$GITHUB_OUTPUT"
            else
              echo 'go=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-go@v5
        if: steps.scope.outputs.go == 'true'
        with:
          go-version: '1.25.x'
      - name: Shared Go tests and vet
        if: steps.scope.outputs.go == 'true'
        run: |
          go test -timeout=120s ./cmd/... ./internal/... ./mobileapi/...
          go vet ./cmd/... ./internal/... ./mobileapi/...
