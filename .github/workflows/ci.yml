name: CI

on:
  push:
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go test -timeout=180s ./cmd/... ./internal/... ./mobileapi/...
      - run: go vet ./cmd/... ./internal/... ./mobileapi/...

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # windows-latest images ship rustup/stable; print the resolved version
      # so a runner-image drift is visible in the log instead of silent.
      - name: Show Rust toolchain
        run: rustup show
      # tauri_build validates bundle inputs even for cargo check: the
      # externalBin sidecar AND the GeoSite.dat resource. Both are gitignored
      # and normally produced by beforeBuildCommand, which only runs under
      # `tauri build/dev` — plain cargo check skips it, so CI reproduces the
      # two steps here (same commands as tauri.conf.json).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build helper sidecar
        run: go build -o apps/windows/src-tauri/binaries/freev6-helper-x86_64-pc-windows-msvc.exe ./cmd/freev6-helper
      - name: Ensure GeoSite.dat resource
        run: go run ./cmd/ensure-geodata
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri
      # --locked: Cargo.lock is tracked; never re-resolve upstream crates in CI.
      # cargo test stays out on purpose: the test binary carries a
      # requireAdministrator manifest (os error 740 when not elevated).
      - run: cargo check --locked --manifest-path apps/windows/src-tauri/Cargo.toml

  # Windows 直接打包 web/；检查本地图标和模块引用。
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository contracts
        run: python3 scripts/maintenance/check-repository.py
      - name: Maintenance protection tests
        run: python3 scripts/maintenance/test_maintenance.py
      - name: Icon subset guard
        run: python3 scripts/check-icons.py
      - name: Verify publisher endpoints
        run: python3 scripts/check-publisher.py
      - name: Verify frontend module imports
        run: node --experimental-vm-modules scripts/check-web-modules.mjs
