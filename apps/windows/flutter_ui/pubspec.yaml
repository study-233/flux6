name: freev6_windows
description: Flux6 Windows Flutter client and isolated interface preview.
publish_to: 'none'
version: 0.5.3+0

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.6'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  prism_ui:
    path: vendor/prism_ui

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - vendor/flclash/LICENSE
    - vendor/prism_ui/LICENSE
    - vendor/prism_ui/NOTICE
    - vendor/Flutter-LICENSE
    - vendor/UPSTREAM.json
    - vendor/MACOS-SOURCE.json
