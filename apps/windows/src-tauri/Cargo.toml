[package]
name = "freev6-desktop"
version = "0.1.3"
description = "Flux6 for CERNET2"
authors = ["Flux6 contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[features]
offline-preview = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
window-vibrancy = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
